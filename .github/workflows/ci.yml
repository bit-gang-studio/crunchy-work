name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 needs --experimental-sqlite (the binary and the test config both
        # detect and handle it); 24 has node:sqlite unflagged. Both must pass.
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # Everything that needs a real browser.
  #
  # `test:dnd` drives the drag harness — collision, pointer position, preview
  # relocation, scroll-container re-measurement — behaviour jsdom cannot see and
  # that the unit tests, which cover the pure reducers, would happily miss.
  # `test:e2e` drives the real binary end to end: built SPA, HTTP API, service
  # layer, SQLite file. Nothing stubbed.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:dnd
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-traces
          path: test-results/
          retention-days: 7
