name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 needs --experimental-sqlite (the binary and the test config both
        # detect and handle it); 24 has node:sqlite unflagged. Both must pass.
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # The drag engine is browser behaviour — collision, pointer position, preview
  # relocation, scroll-container re-measurement — that jsdom cannot see. The unit
  # tests cover the pure reducers; this covers the parts that actually broke.
  dnd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:dnd
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: dnd-traces
          path: test-results/
          retention-days: 7
